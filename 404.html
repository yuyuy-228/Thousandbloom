<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 此路无灯 — 花千树</title>
<meta name="theme-color" content="#0b1222">
<style>
  :root{
    --line:#2c3d6b;
    --zhu:#d4622a; --zhu-lt:#e8793f; --teng:#c9a86a; --jin:#e6c887;
    --moon:#e8dcc8; --yan:#9aa3b5; --dim:#6b7488;
    --serif:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;font-family:var(--serif);color:var(--moon);min-height:100vh;overflow-x:hidden;
    background:
      radial-gradient(ellipse at 78% 18%, rgba(198,200,205,.07), transparent 42%),
      radial-gradient(ellipse at 10% 90%, rgba(217,91,50,.06), transparent 40%),
      linear-gradient(180deg,#17223e 0%,#141d36 46%,#101829 78%,#0d1422 100%)}

  /* ===== 顶部导航 ===== */
  nav{display:flex;align-items:center;gap:26px;padding:20px 52px;flex-wrap:wrap;
    border-bottom:1px solid rgba(44,61,107,.45);position:relative;z-index:6}
  nav .logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700;
    color:var(--teng);letter-spacing:2.5px;text-decoration:none}
  nav .logo svg{width:25px;height:25px;filter:drop-shadow(0 0 6px rgba(201,168,106,.35))}
  nav a{color:#98a1b4;font-size:13.5px;text-decoration:none;letter-spacing:1.2px;transition:.2s}
  nav a:hover{color:var(--jin)}
  nav .home-link{margin-left:auto;display:flex;align-items:center;gap:12px}
  nav .home-link .moon-ico{width:19px;height:19px;opacity:.7}
  nav .home-link .avatar{width:30px;height:30px;border-radius:50%;border:1px solid rgba(201,168,106,.45);
    display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--jin)}

  /* ===== 背景夜景（整页） ===== */
  .scene{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .moon{position:absolute;right:8%;top:11%;width:250px;height:250px;border-radius:50%;
    background:
      radial-gradient(circle at 38% 32%, #dcd7c8 0%, #cfcaba 40%, #bdb8a8 68%, #a9a494 100%);
    box-shadow:0 0 130px 52px rgba(214,208,190,.12), inset -22px -16px 48px rgba(96,90,76,.3)}
  .moon i{position:absolute;border-radius:50%;background:rgba(126,120,104,.2);filter:blur(1px)}
  .moon i:nth-child(1){width:30px;height:26px;left:46px;top:86px}
  .moon i:nth-child(2){width:16px;height:16px;left:124px;top:52px}
  .moon i:nth-child(3){width:22px;height:20px;left:100px;top:156px}
  .moon i:nth-child(4){width:11px;height:11px;left:166px;top:120px}
  .moon i:nth-child(5){width:8px;height:8px;left:74px;top:186px}

  .branch{position:absolute;left:0;top:0;width:100%;height:100%}
  .skyline{position:absolute;left:0;right:0;bottom:0;width:100%;height:52vh;min-height:340px}
  .mist{position:absolute;left:0;right:0;bottom:0;height:30vh;
    background:linear-gradient(to top,rgba(13,20,34,.88) 0%,rgba(15,23,40,.28) 55%,transparent 100%)}

  /* ===== 宫灯 ===== */
  .lantern{position:absolute;width:58px;height:74px;animation:float 5s ease-in-out infinite}
  .lantern .glow{position:absolute;left:50%;top:50%;width:190px;height:190px;transform:translate(-50%,-50%);
    background:radial-gradient(circle,rgba(255,150,66,.42) 0%,rgba(240,120,50,.16) 45%,transparent 70%)}
  .lantern .cap{position:absolute;left:50%;width:22px;height:6px;border-radius:2px;transform:translateX(-50%);
    background:linear-gradient(180deg,#e8c887,#a97f3f)}
  .lantern .cap.top{top:2px}
  .lantern .cap.bot{bottom:6px}
  .lantern .body{position:absolute;left:6px;right:6px;top:8px;bottom:12px;border-radius:11px/15px;
    background:linear-gradient(90deg,#7e2810 0%,#c0451c 22%,#f08a45 46%,#e2662a 62%,#a13413 84%,#6d220d 100%);
    box-shadow:inset 0 0 14px rgba(70,10,0,.55),0 0 22px rgba(255,140,60,.45)}
  .lantern .body:after{content:'';position:absolute;inset:3px 4px;border-radius:9px/13px;
    border:1px solid rgba(255,206,140,.28)}
  .lantern .rib{position:absolute;top:8px;bottom:12px;left:50%;width:1px;background:rgba(255,210,150,.35)}
  .lantern .tassel{position:absolute;left:50%;bottom:-10px;width:1.5px;height:14px;transform:translateX(-50%);
    background:linear-gradient(180deg,#d9a95e,rgba(217,169,94,0))}
  .lantern .tassel:after{content:'';position:absolute;left:-2px;top:8px;width:5px;height:9px;border-radius:1px;
    background:#c08b45;box-shadow:0 0 6px rgba(230,180,100,.7)}
  .lantern.l1{right:24%;top:12%;width:62px;height:80px}
  .lantern.l2{right:4.5%;top:26%;width:40px;height:52px;animation-delay:1.6s}
  .lantern.l3{right:12.5%;top:40%;width:26px;height:34px;opacity:.5;animation-delay:.9s}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-1.6deg)}50%{transform:translateY(-11px) rotate(1.6deg)}}

  .firefly{position:absolute;width:3px;height:3px;border-radius:50%;background:#e9bc70;
    box-shadow:0 0 8px 2px rgba(233,188,112,.5);opacity:.7;animation:rise 9s linear infinite}
  @keyframes rise{0%{transform:translateY(0);opacity:0}12%{opacity:.75}80%{opacity:.5}100%{transform:translateY(-90px);opacity:0}}

  /* ===== 主体 ===== */
  main{position:relative;z-index:4;max-width:1440px;margin:0 auto;padding:96px 6vw 28px}
  .content{max-width:520px}
  .big404{font-size:clamp(94px,9.8vw,132px);font-weight:800;line-height:.92;color:var(--jin);
    text-shadow:0 0 40px rgba(230,200,135,.28);letter-spacing:8px;margin-left:-6px}
  .ttl{display:flex;align-items:stretch;gap:16px;margin:26px 0 0}
  .ttl .bar{width:5px;background:linear-gradient(180deg,var(--zhu-lt),var(--zhu));border-radius:3px;flex:none;
    box-shadow:0 0 14px rgba(217,91,50,.45)}
  .ttl .bar:after{content:'';display:block;width:5px;height:5px;border-radius:50%;background:var(--zhu-lt);
    margin:12px 0 0 -0;opacity:.6}
  .ttl h1{margin:0;font-size:clamp(28px,3.5vw,38px);font-weight:700;color:#efe6d4;letter-spacing:6px;line-height:1.15}
  .verse{margin:14px 0 0 21px;font-size:13.5px;color:#a9b0bf;letter-spacing:2.5px}
  .desc{margin:22px 0 0 21px;font-size:13.5px;line-height:2;color:var(--yan)}
  .acts{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:22px 0 0 21px}
  .btn{display:inline-block;font-family:var(--serif);font-size:15px;letter-spacing:2.5px;
    padding:12px 34px;border-radius:7px;cursor:pointer;text-decoration:none;transition:.2s;border:0}
  .btn.primary{background:linear-gradient(180deg,#e2703a,#cf5724);color:#fff;
    box-shadow:0 12px 28px -12px rgba(224,110,55,.8)}
  .btn.primary:hover{background:linear-gradient(180deg,#ef7f47,#d9612c);transform:translateY(-2px)}
  .btn.ghost{background:rgba(16,24,42,.42);border:1px solid rgba(201,168,106,.55);color:var(--jin)}
  .btn.ghost:hover{background:rgba(201,168,106,.13)}
  .back{color:#98a1b4;font-size:13px;cursor:pointer;background:none;border:0;font-family:var(--serif);letter-spacing:1px}
  .back:hover{color:#fff;text-decoration:underline}

  /* 灯火格 */
  .dots-wrap{display:flex;align-items:center;gap:20px;margin:28px 0 0 21px}
  .dots{display:grid;grid-template-columns:repeat(9,13px);gap:5px}
  .dots i{width:13px;height:13px;border-radius:2.5px;background:#242e49;transition:.35s}
  .dots i.c1{background:#e0a13f;box-shadow:0 0 7px rgba(224,161,63,.35)}
  .dots i.c2{background:#b9663a}
  .dots i.c3{background:#7c4023}
  .dots i.c4{background:#4a3350}
  .dots-cap{font-size:11.5px;color:var(--dim);line-height:1.85;letter-spacing:1.5px}

  .poem{display:inline-flex;align-items:center;gap:12px;margin:24px 0 0 21px;
    border:1px solid rgba(44,61,107,.75);border-radius:8px;padding:9px 18px 9px 10px;
    background:rgba(18,27,48,.55)}
  .poem .badge{width:32px;height:32px;border-radius:6px;background:linear-gradient(180deg,#e2703a,#c9551f);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .poem b{font-size:14px;color:#e7ddc9;font-weight:700;letter-spacing:2.5px}
  .poem span{display:block;font-size:10.5px;color:var(--dim);margin-top:3px;letter-spacing:1px}

  .meta{display:flex;align-items:center;gap:18px;margin:24px 0 0 21px;
    font-family:ui-monospace,Consolas,monospace;font-size:11.5px;letter-spacing:.14em;color:#8d8468}
  .meta .rule{flex:1;height:1px;background:linear-gradient(90deg,rgba(107,116,136,.5),transparent)}
  .meta .route{color:var(--dim);letter-spacing:.06em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kbd-tip{margin:18px 0 0 21px;font-size:11.5px;color:var(--dim);letter-spacing:.5px}
  .kbd-tip kbd{border:1px solid rgba(107,116,136,.45);border-radius:4px;padding:1px 6px;font-size:10.5px;font-family:inherit}

  /* ===== 响应式 ===== */
  @media(max-width:1180px){
    .moon{right:4%;top:15%;width:210px;height:210px}
    .lantern.l1{right:20%;top:11%}
  }
  @media(max-width:880px){
    nav{padding:16px 22px;gap:16px}
    nav a:not(.logo){display:none}
    nav .home-link{margin-left:auto}
    main{padding:24px 22px 30px}
    .content{max-width:none}
    .big404{font-size:clamp(92px,26vw,112px);letter-spacing:5px;text-shadow:0 0 30px rgba(230,200,135,.22);
      margin-top:64px}
    .moon{right:-78px;top:96px;width:252px;height:252px;opacity:.55;
      box-shadow:0 0 80px 26px rgba(214,208,190,.08)}
    .branch{height:760px;opacity:.9;transform:scale(1.55);transform-origin:top left}
    .lantern.l1{right:34px;top:78px;width:46px;height:58px}
    .lantern.l2{display:none}
    .lantern.l3{right:18px;top:176px;width:22px;height:28px;opacity:.4}
    .skyline{height:46vh;min-height:320px;opacity:1}
    .mist{height:30vh}
    .ttl{margin-top:20px}
    .ttl h1{letter-spacing:5px}
    .verse{letter-spacing:1.5px}
    .acts{display:grid;grid-template-columns:1fr;gap:10px;margin:18px 0 0 21px}
    .btn{width:100%;text-align:center;padding:12px 0}
    .back{display:none}
    .dots-wrap{margin-top:22px;gap:16px}
    .dots{grid-template-columns:repeat(9,9px);gap:3px}
    .dots i{width:9px;height:9px;border-radius:2px}
    .desc{margin-top:18px}
    .poem{margin-top:18px}
    .meta{gap:8px;margin-top:18px;font-size:10px;letter-spacing:.06em}
    .kbd-tip{margin-top:14px}
    .meta .rule{display:none}
    .meta .route{max-width:42vw}
    .poem{margin-top:26px}
  }
  @media(max-width:430px){
    .big404{font-size:92px}
    .dots-cap{font-size:11px}
  }
</style>
</head>

        <!-- 暖窗 -->

          <rect x="-7" y="16" width="9" height="14" rx="1.5" fill="#e3aa4e" opacity=".45"/>

<script>
  /* 路由信息 */
  document.getElementById('routeLine').textContent='route: '+location.pathname+location.search;

  /* 灯格：9 × 8，按设计稿的三角灯阵点亮 */
  var PATTERN=[
    '..###....',
    '.#####...',
    '#######..',
    '########.',
    '#########',
    '########.',
    '.#######.',
    '..#####..'
  ];
  var dots=document.getElementById('dots'), cells=[];
  for(var r=0;r<PATTERN.length;r++){
    for(var c=0;c<PATTERN[r].length;c++){
      var d=document.createElement('i');
      if(PATTERN[r][c]==='#'){
        var m=(r*7+c*3)%11;
        d.className=m<6?'c1':(m<8?'c2':(m<10?'c3':'c4'));
      }
      dots.appendChild(d); cells.push(d);
    }
  }
  var allOn=false;
  function lightAll(){
    if(allOn) return; allOn=true;
    cells.forEach(function(cell,idx){
      setTimeout(function(){ cell.className='c1'; }, idx*18);
    });
  }
  document.addEventListener('keydown',function(e){
    if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){ e.preventDefault(); lightAll(); }
  });
  dots.style.pointerEvents='auto'; dots.style.cursor='pointer';
  dots.addEventListener('click',lightAll);

  /* 梅花：五瓣 + 深色花心，沿枝干分布 */
  (function(){
    var box=document.getElementById('blossoms'); if(!box) return;
    var svgNS='http://www.w3.org/2000/svg';
    var flowers=[
      [128,198,12,'#b8543a'],[196,186,9,'#c96a3f'],[252,176,13,'#a94c34'],
      [286,150,8,'#d8c9a8'],[318,104,10,'#c96a3f'],[352,78,7,'#b8543a'],
      [398,118,11,'#c98a4a'],[438,96,8,'#d8c9a8'],[470,66,12,'#b8543a'],
      [512,44,8,'#c96a3f'],[552,28,6,'#d8c9a8'],[574,10,7,'#b8543a'],
      [560,120,9,'#c98a4a'],[606,94,11,'#c96a3f'],[638,156,13,'#a94c34'],
      [672,150,8,'#d8c9a8'],[704,110,10,'#b8543a'],[720,74,7,'#c96a3f'],
      [742,196,9,'#c98a4a'],[790,206,11,'#b8543a'],[824,214,8,'#d8c9a8'],
      [860,232,12,'#c96a3f'],[906,136,9,'#b8543a'],[900,300,8,'#d8c9a8'],
      [936,326,10,'#c96a3f'],[968,348,7,'#b8543a'],[1000,330,9,'#d8c9a8'],
      [1042,368,11,'#c96a3f'],[1080,338,8,'#b8543a'],[1128,414,12,'#a94c34'],
      [1160,404,7,'#d8c9a8'],[1192,398,9,'#b8543a'],[830,252,8,'#b8543a'],
      [672,150,5,'#d8c9a8'],[486,94,7,'#c96a3f'],[244,60,6,'#b8543a'],
      [362,50,5,'#d8c9a8'],[616,6,5,'#c96a3f'],[772,54,6,'#b8543a'],
      [958,128,6,'#c96a3f'],[72,168,6,'#b8543a'],[1122,312,5,'#d8c9a8']
    ];
    function flower(x,y,r,color){
      var g=document.createElementNS(svgNS,'g');
      g.setAttribute('transform','translate('+x+' '+y+') rotate('+((x+y)%72)+')');
      for(var i=0;i<5;i++){
        var p=document.createElementNS(svgNS,'ellipse');
        p.setAttribute('cx','0'); p.setAttribute('cy',String(-r*0.7));
        p.setAttribute('rx',String(r*0.39)); p.setAttribute('ry',String(r*0.56));
        p.setAttribute('fill',color); p.setAttribute('opacity','0.92');
        p.setAttribute('transform','rotate('+(i*72)+')');
        g.appendChild(p);
      }
      var c=document.createElementNS(svgNS,'circle');
      c.setAttribute('r',String(r*0.22)); c.setAttribute('fill','#3a2a20');
      g.appendChild(c);
      var dot=document.createElementNS(svgNS,'circle');
      dot.setAttribute('r',String(r*0.09)); dot.setAttribute('fill','#e6c887');
      g.appendChild(dot);
      box.appendChild(g);
    }
    flowers.forEach(function(f){ flower(f[0],f[1],f[2],f[3]); });
    /* 花苞 */
    [[300,190,4],[360,110,3.4],[530,72,3.6],[688,168,3.2],[870,282,3.6],
     [1012,372,3.2],[1100,352,3],[150,224,3.6],[410,134,3.4],[1180,420,3]].forEach(function(b){
      var c=document.createElementNS(svgNS,'circle');
      c.setAttribute('cx',b[0]); c.setAttribute('cy',b[1]); c.setAttribute('r',b[2]);
      c.setAttribute('fill','#a94c34'); c.setAttribute('opacity','.85');
      box.appendChild(c);
    });
  })();
